<script>
(() => {
  // Paste the Google Form link here (the plain /viewform link or a pre-filled one both work).
  const GOOGLE_FORM_URL = 'PASTE_YOUR_GOOGLE_FORM_LINK_HERE';
  const box = document.getElementById('survey');
  const isForm = GOOGLE_FORM_URL.includes('docs.google.com/forms') || GOOGLE_FORM_URL.includes('forms.gle/');
  if (!isForm) {
    box.innerHTML = '<p class="heads-up"><i class="ti ti-clock" aria-hidden="true"></i><span><strong>The survey isn’t open yet.</strong> Check back soon.</span></p>';
    return;
  }
  const frame = document.createElement('iframe');
  frame.src = GOOGLE_FORM_URL + (GOOGLE_FORM_URL.includes('?') ? '&' : '?') + 'embedded=true';
  frame.title = 'Teen Money Lab survey';
  frame.loading = 'lazy';
  frame.style.cssText = 'width:100%;height:1500px;border:1px solid var(--line);border-radius:20px;background:var(--surface)';
  const link = document.createElement('p');
  link.className = 'fine';
  link.innerHTML = 'Trouble seeing the form? <a target="_blank" rel="noopener">Open it in a new tab</a>.';
  link.querySelector('a').href = GOOGLE_FORM_URL;
  box.append(frame, link);
})();
</script>
